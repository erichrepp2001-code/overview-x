name: Weltmärkte laden

on:
  schedule:
    - cron: "43 6 * * 2-6"    # morgens (Zeit in UTC), nach den US-Schlusskursen
    - cron: "43 15 * * 1-5"   # nachmittags, falls Daten verspätet kommen
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect_markets.py"
      - ".github/workflows/markets.yml"

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse laden
        run: python scripts/collect_markets.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          git diff --cached --quiet && { echo "Keine Änderung."; exit 0; }
          git commit -m "Weltmärkte aktualisiert"
          git pull --rebase origin main
          git push
