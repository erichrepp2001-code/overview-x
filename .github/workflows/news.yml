name: News sammeln

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden (Zeit in UTC)
  workflow_dispatch:          # Knopf "Run workflow" in der GitHub-App
  push:
    branches: [main]
    paths:
      - "scripts/collect_news.py"
      - ".github/workflows/news.yml"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds lesen und news.json schreiben
        run: python scripts/collect_news.py

      - name: Speichern, falls sich etwas geändert hat
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "News aktualisiert"
          git pull --rebase origin main
          git push
